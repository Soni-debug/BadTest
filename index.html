<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Sounds</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, sans-serif; }
  body { background: #0f0f1a; color: white; min-height: 100vh; padding: 20px; position: relative; }
  #bgImage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; display: none; }

  h1 { text-align:center; font-size: 28px; margin: 15px 0 2px; text-shadow: 0 2px 10px black; position: relative; z-index: 2; }
  h1 span { color: #ff3d71; }

  /* --- TA SIGNATURE --- */
  .by { text-align:center; font-size: 13px; color: #fff; opacity: 0.95; margin: 0 0 8px; text-shadow: 0 1px 6px black; position: relative; z-index: 2; font-weight: bold; letter-spacing: 0.5px; }

  p.subtitle { text-align:center; color: #ddd; margin-bottom: 25px; font-size: 15px; text-shadow: 0 1px 5px black; position: relative; z-index: 2; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; margin: 0 auto; position: relative; z-index: 2; }
  .card { border-radius: 20px; padding: 22px 10px; text-align:center; cursor:pointer; border: 2px solid rgba(255,255,255,0.3); transition: 0.2s; }
  .card:active { transform: scale(0.95); }
  .card .emoji { font-size: 48px; display:block; margin-bottom: 10px; }
  .card h2 { font-size: 17px; margin-bottom: 5px; }
  .card p { font-size: 12px; opacity: 0.9; }
  .naruto { background: linear-gradient(135deg, rgba(255,107,0,0.9), rgba(255,154,0,0.9)); }
  .onepiece { background: linear-gradient(135deg, rgba(230,57,70,0.9), rgba(255,77,109,0.9)); }
  .demon { background: linear-gradient(135deg, rgba(0,180,216,0.9), rgba(0,119,182,0.9)); }
  .jujutsu { background: linear-gradient(135deg, rgba(114,9,183,0.9), rgba(58,12,163,0.9)); }
  .playing { border-color: white !important; box-shadow: 0 0 25px white; transform: scale(1.03); }
  #nowPlaying { text-align:center; margin-top: 25px; font-size: 15px; font-weight:bold; color: #ffde59; min-height: 20px; text-shadow: 0 1px 5px black; position: relative; z-index: 2; }
  #charName { text-align:center; font-size: 32px; font-weight:900; margin-top:10px; text-shadow: 0 3px 15px black; letter-spacing: 1px; min-height: 40px; position: relative; z-index: 2; }
  .btn { display:block; margin:12px auto; padding:13px 22px; border-radius:50px; border:none; font-weight:bold; font-size:15px; cursor:pointer; width: 280px; position: relative; z-index: 2; }
  #loopBtn { background:white; color:black; }
  #loopBtn.on { background:#ffde59; color:black; }
  #boostBtn { background:#ff3d71; color:white; }
  #boostBtn.on { background:#00e676; color:black; }
  .info { text-align:center; color:#ccc; font-size:12px; margin-top:10px; text-shadow: 0 1px 3px black; position: relative; z-index: 2; }
</style>
</head>
<body>

<img id="bgImage" src="" alt="">

<h1>ANIME <span>SOUNDS</span> 🎧</h1>
<p class="by">(By SoniiiTheGhost 👻)</p>
<p class="subtitle">Choisis ton anime, écoute le son</p>

<div class="grid">
  <div class="card naruto" onclick="playSound(this, 'Naruto 🍥', 'NARUTO UZUMAKI')">
    <span class="emoji">🍥</span><h2>NARUTO</h2><p>Dattebayo !</p>
  </div>
  <div class="card onepiece" onclick="playSound(this, 'One Piece 🏴‍☠️', 'MONKEY D. LUFFY')">
    <span class="emoji">🏴‍☠️</span><h2>ONE PIECE</h2><p>Gear 5 !</p>
  </div>
  <div class="card demon" onclick="playSound(this, 'Demon Slayer ⚔️', 'TANJIRO KAMADO')">
    <span class="emoji">⚔️</span><h2>DEMON SLAYER</h2><p>Hinokami !</p>
  </div>
  <div class="card jujutsu" onclick="playSound(this, 'Jujutsu Kaisen 👊', 'SATORU GOJO')">
    <span class="emoji">👊</span><h2>JUJUTSU KAISEN</h2><p>Gojo !</p>
  </div>
</div>

<div id="charName"></div>
<div id="nowPlaying">👆 Clique sur une carte</div>

<button id="loopBtn" class="btn" onclick="toggleLoop()">🔁 Boucle : OFF</button>
<button id="boostBtn" class="btn on" onclick="toggleBoost()">🔊 Booster Volume : ON</button>
<p class="info">La même image s'affiche pour toutes les cartes.</p>

<audio id="player" src="A%2012.mp3" preload="auto"></audio>

<script>
  const player = document.getElementById('player');
  const nowPlaying = document.getElementById('nowPlaying');
  const charName = document.getElementById('charName');
  const loopBtn = document.getElementById('loopBtn');
  const boostBtn = document.getElementById('boostBtn');
  const bgImage = document.getElementById('bgImage');

  let audioCtx = null, gainNode = null, compressor = null, boostOn = true;
  function initAudioBoost() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(player);
      gainNode = audioCtx.createGain();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -24; compressor.ratio.value = 12;
      compressor.attack.value = 0.003; compressor.release.value = 0.25;
      gainNode.gain.value = 2.5;
      source.connect(gainNode); gainNode.connect(compressor); compressor.connect(audioCtx.destination);
    } catch(e) {}
  }
  function toggleBoost() {
    boostOn = !boostOn;
    if (gainNode) gainNode.gain.value = boostOn ? 2.5 : 1.0;
    boostBtn.textContent = boostOn ? '🔊 Booster Volume : ON' : '🔊 Booster Volume : OFF';
    boostBtn.classList.toggle('on', boostOn); player.volume = 1.0;
  }
  let loopOn = false;
  function toggleLoop() {
    loopOn = !loopOn; player.loop = loopOn;
    loopBtn.textContent = loopOn ? '🔁 Boucle : ON - Clique pour arrêter' : '🔁 Boucle : OFF';
    loopBtn.classList.toggle('on', loopOn);
  }

  bgImage.onload = () => { bgImage.style.display = 'block'; };
  bgImage.onerror = () => { bgImage.style.display = 'none'; };

  function playSound(card, name, char) {
    initAudioBoost();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
    card.classList.add('playing');
    bgImage.src = 'fond.jpj.jpeg';
    charName.textContent = char;
    nowPlaying.textContent = '▶️ En train de jouer : ' + name;
    player.volume = 1.0; player.currentTime = 0; player.play();
  }
  player.onended = () => {
    if (!player.loop) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      nowPlaying.textContent = '👆 Clique sur une carte';
    }
  };
</script>
</body>
</html>
